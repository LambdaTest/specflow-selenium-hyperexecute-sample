---
version: 0.1
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: mac

runtime:
  language: dotnet
  version: "8.0"

retryOnFailure: true
maxRetries: 1
concurrency: 3

env:
  NUGET_PACKAGES: '/Users/ltuser/.nuget/packages/'
  NUGET_HTTP_CACHE_PATH: '/Users/ltuser/.local/share/NuGet/v3-cache'
  NUGET_PLUGINS_CACHE_PATH: '/Users/ltuser/.local/share/NuGet/plugins-cache'

matrix:
  project: ["OnlySpecTest.sln"]
  #Parallel execution at feature level
  scenario: ["ToDoTest", "LoginTest_Success", "LoginTest_Failure"]

pre:
 - dotnet build -c Release

cacheKey: '{{ checksum "OnlySpecTest.csproj" }}'

post:
  - cat yaml/mac/specflow_hyperexecute_matrix_sample.yaml

mergeArtifacts: true

uploadArtefacts:
 - name: Execution_Report
   path:
    - Report/**
    - Reports/**
 - name: Execution_Screenshots
   path:
    - Screenshots/**/**
    - Reports/**/Screenshots/**

report: true
partialReports:
  location: Report/
  type: html
  frameworkName: specflow

#Parallel execution at feature level
#testSuites:
#  - dotnet test $project --filter Name~$feature
testSuites:
  - dotnet test $project --filter "(Category=$scenario)"

jobLabel: [selenium-specflow, mac, matrix]