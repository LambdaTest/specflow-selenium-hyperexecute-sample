---
version: 0.1

runson: linux

retryOnFailure: true
maxRetries: 1

autosplit: true

runtime:
  language: dotnet
  version: "8.0"

concurrency: 3

pre:
 - dotnet build
 - dotnet --version
 
cacheKey: '{{ checksum "packages.txt" }}'

post:
  - cat yaml/linux/specflow_hyperexecute_autosplit_sample.yaml

mergeArtifacts: true

uploadArtefacts:
 - name: Execution_Report
   path:
    - Report/**
    - Reports/**
 - name: Execution_Screenshots
   path:
    - Screenshots/**/**
    - Reports/**/Screenshots/**

report: true
partialReports:
  location: Report/
  type: html
  frameworkName: specflow
  
testDiscovery:
  type: raw
  mode: dynamic
  command: grep -rni 'Features' -e '@' --include=\*.feature | sed 's/.*@//'

testRunnerCommand: dotnet test --filter "(Category=$test)"

jobLabel: [selenium-specflow, linux, autosplit]